<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 옮겼습니다 · 엘더스크롤 온라인 한글 패치</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <style>
    body {
      margin: 0;
      background: #f6f4ef;
      color: #1f1d1a;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
      line-height: 1.65;
      word-break: keep-all;
    }
    a { color: #8a5a19; }
    @media (prefers-color-scheme: dark) {
      body { background: #141311; color: #ece8e1; }
      a { color: #e0b46a; }
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 옮겼습니다</h1>
    <p>esokr.org 웹 번역 사이트는 운영을 마쳤습니다. 한글 패치는 <a id="home" href="https://esokr.org/">첫 페이지</a>에서 받을 수 있습니다.</p>
  </main>
  <script>
    // 옛 주소(/download, /translate 등)로 들어오면 첫 페이지로 보냅니다.
    // github.io 미리보기 주소에서는 /저장소이름/ 이 첫 페이지입니다.
    // 정적 링크는 https://esokr.org/ 이고, 미리보기 주소에서만 덮어씁니다.
    const base = location.hostname.endsWith('github.io')
      ? '/' + location.pathname.split('/')[1] + '/'
      : '/';
    if (base !== '/') document.getElementById('home').href = base;
    if (location.pathname !== base) location.replace(base);
  </script>
</body>
</html>
